<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Music Show - track filter viewer</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --row-hover: #f5f5f5;
    --keep: #1a7f37;
    --keep-bg: #dafbe1;
    --exclude: #b42318;
    --exclude-bg: #fde2e1;
    --review: #9a6700;
    --review-bg: #fef2c7;
    --link: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --row-hover: #161b22;
      --keep: #3fb950;
      --keep-bg: #103a1d;
      --exclude: #f85149;
      --exclude-bg: #3d1210;
      --review: #d29922;
      --review-bg: #3b2c05;
      --link: #58a6ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.9rem; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1rem;
  }
  input[type="search"] {
    flex: 1 1 240px;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.9rem;
  }
  .filters { display: flex; gap: 1rem; flex-wrap: wrap; }
  .filters label {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
  }
  .counts { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem; }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; white-space: nowrap; }
  th, td { padding: 0.55rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
  th {
    position: sticky;
    top: 0;
    background: var(--bg);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  td.title, td.artist { white-space: normal; max-width: 28ch; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .badge.keep { color: var(--keep); background: var(--keep-bg); }
  .badge.exclude { color: var(--exclude); background: var(--exclude-bg); }
  .badge.review { color: var(--review); background: var(--review-bg); }
  .tag { color: var(--muted); font-size: 0.85rem; }
  .empty, .error { padding: 2rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<h1>New Music Show - track filter viewer</h1>
<p class="subtitle">
  Live view of <code>data/tracks_filtered.jsonl</code> from
  <a href="https://github.com/networkop/new-music" target="_blank" rel="noopener">networkop/new-music</a>.
  See <a href="https://github.com/networkop/new-music/blob/main/docs/filtering.md" target="_blank" rel="noopener">docs/filtering.md</a> for how genre and category are decided.
</p>

<div class="controls">
  <input type="search" id="search" placeholder="Search artist or title…">
  <div class="filters" id="filters">
    <label><input type="checkbox" value="keep" checked> Keep</label>
    <label><input type="checkbox" value="review" checked> Review</label>
    <label><input type="checkbox" value="exclude" checked> Exclude</label>
  </div>
</div>

<p class="counts" id="counts">Loading…</p>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Broadcast</th>
        <th>Artist</th>
        <th>Title</th>
        <th>Decision</th>
        <th>Genre</th>
        <th>Category</th>
        <th>Matched tag</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/networkop/new-music/main/data/tracks_filtered.jsonl";

let allTracks = [];

async function load() {
  const res = await fetch(DATA_URL, { cache: "no-store" });
  if (!res.ok) throw new Error(`fetch failed: ${res.status}`);
  const text = await res.text();
  const parsed = text
    .split("\n")
    .filter(line => line.trim())
    .map(line => {
      try { return JSON.parse(line); } catch { return null; }
    })
    .filter(Boolean)
    .sort((a, b) => (b.broadcast || "").localeCompare(a.broadcast || "") || a.position - b.position);
  allTracks = dedupe(parsed);
  render();
}

// The same song re-airs across multiple broadcasts within the window (some
// up to 8x) - that's correct in the underlying data (sync.py needs every
// airing to compute the 30-day window) but reads as noise here. Keep one
// row per artist+title: since parsed is already sorted newest-first, the
// first occurrence encountered is the most recent airing.
function dedupe(tracks) {
  const seen = new Map();
  for (const t of tracks) {
    const key = t.artist.toLowerCase() + "|||" + t.title.toLowerCase();
    if (seen.has(key)) {
      seen.get(key).count += 1;
    } else {
      seen.set(key, { ...t, count: 1 });
    }
  }
  return [...seen.values()];
}

function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const checked = new Set(
    [...document.querySelectorAll("#filters input:checked")].map(el => el.value)
  );

  const visible = allTracks.filter(t => {
    if (!checked.has(t.decision)) return false;
    if (!query) return true;
    return t.artist.toLowerCase().includes(query) || t.title.toLowerCase().includes(query);
  });

  const total = allTracks.length;
  const keep = allTracks.filter(t => t.decision === "keep").length;
  const exclude = allTracks.filter(t => t.decision === "exclude").length;
  const review = allTracks.filter(t => t.decision === "review").length;
  document.getElementById("counts").textContent =
    `${visible.length} of ${total} tracks shown  ·  ${keep} keep / ${exclude} exclude / ${review} review overall`;

  const rows = document.getElementById("rows");
  if (visible.length === 0) {
    rows.innerHTML = `<tr><td colspan="7" class="empty">No tracks match.</td></tr>`;
    return;
  }

  rows.innerHTML = visible.map(t => `
    <tr>
      <td>
        <a href="https://www.bbc.co.uk/programmes/${t.episode_pid}" target="_blank" rel="noopener">${t.broadcast}</a>
        ${t.count > 1 ? `<span class="tag">×${t.count}</span>` : ""}
      </td>
      <td class="artist">${escapeHtml(t.artist)}</td>
      <td class="title">${escapeHtml(t.title)}</td>
      <td><span class="badge ${t.decision}">${t.decision}</span></td>
      <td class="tag">${t.genre ? escapeHtml(t.genre) : "—"}</td>
      <td class="tag">${t.category ? escapeHtml(t.category) : "—"}</td>
      <td class="tag">${t.matched_tag ? escapeHtml(t.matched_tag) : "—"}</td>
    </tr>
  `).join("");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filters").addEventListener("change", render);

load().catch(err => {
  document.getElementById("rows").innerHTML =
    `<tr><td colspan="7" class="error">Failed to load data: ${escapeHtml(err.message)}</td></tr>`;
  document.getElementById("counts").textContent = "";
});
</script>

</body>
</html>
